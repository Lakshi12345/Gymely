  <script>
    (function () {
      var targetKey = 'aigenix_cs_target';
      var targetTime = localStorage.getItem(targetKey);

      // If target time doesn't exist, set it to 30 days from now
      if (!targetTime) {
        targetTime = Date.now() + 30 * 24 * 60 * 60 * 1000;
        localStorage.setItem(targetKey, targetTime);
      } else {
        targetTime = parseInt(targetTime, 10);
      }

      function pad(n) { return String(n).padStart(2, '0'); }

      function tick() {
        var now = Date.now();
        var diff = targetTime - now;

        // If countdown has expired, reset it to another 30 days so it continues working
        if (diff <= 0) {
          targetTime = Date.now() + 30 * 24 * 60 * 60 * 1000;
          localStorage.setItem(targetKey, targetTime);
          diff = targetTime - now;
        }

        var d = Math.floor(diff / 86400000);
        var h = Math.floor((diff % 86400000) / 3600000);
        var m = Math.floor((diff % 3600000) / 60000);
        var s = Math.floor((diff % 60000) / 1000);

        var el;
        if (el = document.getElementById('cs-days')) el.textContent = pad(d);
        if (el = document.getElementById('cs-hours')) el.textContent = pad(h);
        if (el = document.getElementById('cs-mins')) el.textContent = pad(m);
        if (el = document.getElementById('cs-secs')) el.textContent = pad(s);
      }

      tick();
      setInterval(tick, 1000);
    })();
  </script>
